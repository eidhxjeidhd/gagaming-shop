<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gà Gaming - Temp Mail</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #131b2e;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 20px;
            color: #fbbf24;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 13px;
            color: #94a3b8;
        }
        .label {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 8px;
            display: block;
        }
        .email-box-wrapper {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .email-input {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #4ade80;
            font-size: 14px;
            padding: 12px;
            outline: none;
            text-align: center;
            font-weight: 600;
        }
        .btn-copy {
            background: #fbbf24;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 0 16px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-copy:active {
            opacity: 0.8;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .btn {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #fff;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-change {
            background: #3b82f6;
        }
        .btn-check {
            background: #10b981;
        }
        .inbox-section {
            margin-top: 10px;
        }
        .inbox-title {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .inbox-box {
            background: #0b0f19;
            border: 1px solid #1e293b;
            border-radius: 10px;
            min-height: 140px;
            max-height: 220px;
            overflow-y: auto;
            padding: 12px;
            font-size: 13px;
            color: #64748b;
            text-align: center;
        }
        .email-item {
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: left;
            color: #f8fafc;
            cursor: pointer;
        }
        .email-item .sender {
            font-weight: bold;
            color: #fbbf24;
            font-size: 12px;
        }
        .email-item .subject {
            font-size: 13px;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🐔 GÀ GAMING - TEMP MAIL</h1>
            <p>Hệ thống tạo email tạm thời nhận mã OTP tự động</p>
        </div>

        <label class="label">Email ảo của bạn:</label>
        <div class="email-box-wrapper">
            <input type="text" id="emailDisplay" class="email-input" readonly value="Đang tạo email...">
            <button class="btn-copy" onclick="copyEmail()">Sao chép</button>
        </div>

        <div class="btn-row">
            <button class="btn btn-change" onclick="getNewEmail()">🔄 Đổi Email Khác</button>
            <button class="btn btn-check" onclick="checkInbox()">📬 Kiểm Tra Hộp Thư</button>
        </div>

        <div class="inbox-section">
            <div class="inbox-title" id="inboxStatus">Hộp thư đến (Đang chờ thư...):</div>
            <div class="inbox-box" id="inboxContent">
                Chưa có tin nhắn nào đến...
            </div>
        </div>
    </div>

    <script>
        let currentEmail = "";
        let currentLogin = "";
        let currentDomain = "";

        // Danh sách domain dự phòng từ 1secmail
        const domains = ["1secmail.com", "1secmail.org", "1secmail.net", "wwjmp.com", "esiix.com"];

        function getRandomDomain() {
            return domains[Math.floor(Math.random() * domains.length)];
        }

        async function getNewEmail() {
            const emailDisplay = document.getElementById("emailDisplay");
            const inboxContent = document.getElementById("inboxContent");
            const inboxStatus = document.getElementById("inboxStatus");
            
            emailDisplay.value = "Đang kết nối...";
            inboxContent.innerHTML = "Chưa có tin nhắn nào đến...";
            inboxStatus.innerText = "Hộp thư đến (Đang chờ thư...):";

            try {
                // Tạo tên ngẫu nhiên 10 ký tự
                const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
                let username = "";
                for (let i = 0; i < 10; i++) {
                    username += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                currentDomain = getRandomDomain();
                currentLogin = username;
                currentEmail = `${username}@${currentDomain}`;

                // Test gọi API để xác thực kết nối
                let response = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${currentLogin}&domain=${currentDomain}`);
                if (!response.ok) throw new Error("Network response was not ok");
                
                emailDisplay.value = currentEmail;
            } catch (error) {
                console.error(error);
                // Fallback tạo email bằng domain khác hoặc báo lỗi rõ ràng
                emailDisplay.value = "Lỗi kết nối tạo email (Thử lại)";
            }
        }

        function copyEmail() {
            const emailDisplay = document.getElementById("emailDisplay");
            if (!currentEmail || emailDisplay.value.includes("Lỗi")) {
                alert("Chưa có email hợp lệ để sao chép!");
                return;
            }
            navigator.clipboard.writeText(currentEmail).then(() => {
                alert("Đã sao chép: " + currentEmail);
            }).catch(err => {
                // Fallback cho trình duyệt cũ
                emailDisplay.select();
                document.execCommand("copy");
                alert("Đã sao chép: " + currentEmail);
            });
        }

        async function checkInbox() {
            if (!currentLogin || !currentDomain) {
                alert("Vui lòng tạo email trước!");
                getNewEmail();
                return;
            }

            const inboxContent = document.getElementById("inboxContent");
            const inboxStatus = document.getElementById("inboxStatus");
            inboxStatus.innerText = "Hộp thư đến (Đang kiểm tra...):";

            try {
                let response = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${currentLogin}&domain=${currentDomain}`);
                let messages = await response.json();

                if (messages && messages.length > 0) {
                    inboxContent.innerHTML = "";
                    inboxStatus.innerText = `Hộp thư đến (${messages.length} thư mới):`;
                    
                    messages.forEach(msg => {
                        let div = document.createElement("div");
                        div.className = "email-item";
                        div.innerHTML = `<div class="sender">Từ: ${msg.from}</div><div class="subject">Tiêu đề: ${msg.subject}</div>`;
                        div.onclick = () => readMessage(msg.id);
                        inboxContent.appendChild(div);
                    });
                } else {
                    inboxStatus.innerText = "Hộp thư đến (Không có thư mới):";
                    inboxContent.innerHTML = "Chưa có tin nhắn nào đến...";
                }
            } catch (error) {
                console.error(error);
                inboxStatus.innerText = "Hộp thư đến (Lỗi kết nối):";
                inboxContent.innerHTML = "Không thể kết nối đến máy chủ thư!";
            }
        }

        async function readMessage(id) {
            try {
                let response = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${currentLogin}&domain=${currentDomain}&id=${id}`);
                let data = await response.json();
                
                const inboxContent = document.getElementById("inboxContent");
                inboxContent.innerHTML = `
                    <div style="text-align: left; padding: 5px;">
                        <button onclick="checkInbox()" style="background:#3b82f6; color:#fff; border:none; padding:5px 10px; border-radius:5px; margin-bottom:8px; cursor:pointer;">⬅ Quay lại</button>
                        <p><b>Từ:</b> ${data.from}</p>
                        <p><b>Tiêu đề:</b> ${data.subject}</p>
                        <hr style="border-color:#334155; margin:6px 0;">
                        <div>${data.body || data.textBody}</div>
                    </div>
                `;
            } catch (error) {
                alert("Không thể đọc nội dung tin nhắn!");
            }
        }

        // Tự động tạo email khi load trang
        window.onload = getNewEmail;
    </script>
</body>
</html>
