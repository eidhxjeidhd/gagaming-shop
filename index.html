<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gà Gaming - Tạo Gmail Ảo Nhanh</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-black text-yellow-400">🐔 GÀ GAMING - TEMP MAIL</h1>
            <p class="text-slate-400 text-xs">Hệ thống tạo email tạm thời nhận mã OTP tự động</p>
        </div>

        <!-- Ô hiển thị Email Ảo -->
        <div class="space-y-2">
            <label class="block text-xs font-semibold text-slate-400">Email ảo của bạn:</label>
            <div class="flex items-center space-x-2">
                <input type="text" id="emailBox" readonly class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-emerald-400 font-mono text-sm focus:outline-none" value="Đang tạo email...">
                <button onclick="copyEmail()" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold px-4 py-3 rounded-xl text-sm transition">Sao chép</button>
            </div>
        </div>

        <!-- Nút tạo mới / Đổi email -->
        <div class="flex space-x-2">
            <button onclick="getNewEmail()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-sm transition">🔄 Đổi Email Khác</button>
            <button onclick="checkInbox()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-sm transition">📥 Kiểm Tra Hộp Thư</button>
        </div>

        <!-- Danh sách tin nhắn / Mã OTP đến -->
        <div class="space-y-2">
            <label class="block text-xs font-semibold text-slate-400">Hộp thư đến (Đang chờ thư...):</label>
            <div id="inboxList" class="bg-slate-950 border border-slate-800 rounded-xl p-4 min-h-[150px] max-h-[250px] overflow-y-auto text-xs space-y-2 text-slate-300">
                <p class="text-slate-500 text-center italic mt-10">Chưa có tin nhắn nào đến...</p>
            </div>
        </div>
    </div>

    <!-- Script xử lý kết nối API tạo mail ảo -->
    <script>
        let currentEmail = '';
        let login = '';
        let domain = '';

        async function getNewEmail() {
            document.getElementById('emailBox').value = "Đang tạo...";
            try {
                let res = await fetch('https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1');
                let data = await res.json();
                currentEmail = data[0];
                let parts = currentEmail.split('@');
                login = parts[0];
                domain = parts[1];
                
                document.getElementById('emailBox').value = currentEmail;
                document.getElementById('inboxList').innerHTML = '<p class="text-slate-500 text-center italic mt-10">Đã tạo email mới, đang chờ thư...</p>';
            } catch (e) {
                document.getElementById('emailBox').value = "Lỗi kết nối tạo email!";
            }
        }

        function copyEmail() {
            let emailBox = document.getElementById('emailBox');
            emailBox.select();
            navigator.clipboard.writeText(emailBox.value);
            alert('Đã sao chép email: ' + emailBox.value);
        }

        async function checkInbox() {
            if (!login || !domain) return;
            let inboxDiv = document.getElementById('inboxList');
            inboxDiv.innerHTML = '<p class="text-yellow-400 text-center italic mt-10">Đang kiểm tra tin nhắn...</p>';

            try {
                let res = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${login}&domain=${domain}`);
                let messages = await res.json();

                if (messages.length === 0) {
                    inboxDiv.innerHTML = '<p class="text-slate-500 text-center italic mt-10">Hộp thư trống.</p>';
                } else {
                    inboxDiv.innerHTML = '';
                    messages.forEach(msg => {
                        inboxDiv.innerHTML += `
                            <div class="bg-slate-900 border border-slate-700 p-3 rounded-lg cursor-pointer hover:border-yellow-400" onclick="readMessage(${msg.id})">
                                <b class="text-yellow-400">Từ: ${msg.from}</b><br>
                                <span>Tiêu đề: ${msg.subject}</span>
                                <div class="text-[10px] text-slate-500 mt-1">${msg.date}</div>
                            </div>`;
                    });
                }
            } catch (e) {
                inboxDiv.innerHTML = '<p class="text-red-400 text-center italic mt-10">Lỗi khi tải hộp thư!</p>';
            }
        }

        async function readMessage(id) {
            try {
                let res = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${login}&domain=${domain}&id=${id}`);
                let mail = await res.json();
                alert(`Nội dung thư từ [${mail.from}]:\n\n${mail.textBody || mail.htmlBody}`);
            } catch (e) {
                alert('Không thể đọc nội dung thư này.');
            }
        }

        // Tự động tạo email ngay khi mở web
        getNewEmail();
    </script>
</body>
</html>
