<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gà Gaming Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl space-y-4">
        <div class="text-center">
            <div class="text-3xl">🐔</div>
            <h1 class="text-xl font-black text-yellow-400">GÀ GAMING SHOP</h1>
            <p class="text-slate-400 text-xs">Hệ thống Shop Game Tự Động 100%</p>
        </div>

        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
            <h2 class="text-sm font-bold text-cyan-400">Kho Tài Khoản (Live DB):</h2>
            <div id="product-list" class="space-y-2">
                <p class="text-xs text-slate-500 text-center py-4">Đang kết nối cơ sở dữ liệu...</p>
            </div>
        </div>

        <button onclick="loadProducts()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-yellow-500/20">
            Làm Mới Dữ Liệu
        </button>
    </div>

    <!-- Sử dụng ES Module trực tiếp chuẩn 100% không sợ lệch phiên bản -->
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'https://nqozzdvaousgacpjiglw.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_sUYd7prmWNfB2ZUo7gMHEg_BnzBLOAM';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.loadProducts = async function() {
            const listDiv = document.getElementById('product-list');
            listDiv.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Đang tải dữ liệu từ Supabase...</p>';

            try {
                const { data, error } = await supabase.from('products').select('*');
                
                if (error) {
                    throw error;
                }

                if (!data || data.length === 0) {
                    listDiv.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Chưa có sản phẩm nào trong kho.</p>';
                    return;
                }

                let html = '';
                data.forEach(item => {
                    let priceFormatted = Number(item.price).toLocaleString() + 'đ';
                    html += `
                        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs">
                            <div class="space-y-1">
                                <div class="font-bold text-white">${item.name}</div>
                                <div class="text-[10px] text-slate-400">Kho: Còn hàng</div>
                            </div>
                            <div class="text-right space-y-1">
                                <div class="text-yellow-400 font-bold">${priceFormatted}</div>
                                <button onclick="alert('Thông tin tài khoản: ${item.account_info || "Chưa cập nhật"}')" class="bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 px-2.5 py-1 rounded-lg text-[10px] font-bold transition">
                                    Mua Ngay
                                </button>
                            </div>
                        </div>
                    `;
                });
                listDiv.innerHTML = html;
            } catch (err) {
                console.error(err);
                listDiv.innerHTML = `<p class="text-xs text-red-400 text-center py-2 bg-red-500/10 p-3 rounded-xl border border-red-500/20">Lỗi: ${err.message || 'Không thể kết nối!'}</p>`;
            }
        }

        // Tự động chạy hàm ngay khi load trang
        window.loadProducts();
    </script>
</body>
</html>
