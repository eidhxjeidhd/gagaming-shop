<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gà Gaming - Key System</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --border-color: #ced4da;
            --success-color: #28a745;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h2 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: #222;
        }
        .header span {
            font-size: 13px;
            background: #6c757d;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        .btn-generate {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-generate:hover {
            background-color: var(--primary-hover);
        }
        .result-box {
            margin-top: 20px;
            display: none;
            text-align: center;
        }
        .key-display {
            background: #e9ecef;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 8px;
            word-break: break-all;
            color: #d9534f;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Gà Gaming - Key System</h2>
            <span>Mod Menu Only</span>
        </div>

        <div id="generator-form">
            <div class="form-group">
                <label for="game">Game / Ứng dụng</label>
                <select id="game">
                    <option value="thanhdo_external">THANHDO External</option>
                    <option value="free_fire">Free Fire VIP Menu</option>
                    <option value="lien_quan">Liên Quân Mobile</option>
                </select>
            </div>

            <div class="form-group">
                <label>Số lượng thiết bị</label>
                <input type="text" value="1 device" readonly style="background-color: #e9ecef; color: #555;">
            </div>

            <div class="form-group">
                <label for="duration">Thời hạn sử dụng</label>
                <select id="duration">
                    <option value="24">24 Giờ</option>
                    <option value="168">7 Ngày</option>
                    <option value="720">30 Ngày</option>
                </select>
            </div>

            <div class="form-group">
                <label>Loại Key</label>
                <select>
                    <option>VIP FREE (Vượt Link)</option>
                </select>
            </div>

            <button class="btn-generate" onclick="generateKey()">🚀 Tạo Key Ngay</button>
        </div>

        <div id="result-container" class="result-box">
            <label>Key của bạn:</label>
            <div class="key-display" id="final-key">GG-VN-XXXXXX</div>
            <button class="btn-generate" style="background-color: var(--success-color); margin-top: 10px;" onclick="copyKey()">📋 Sao Chép Key</button>
        </div>

        <div class="footer">
            &copy; 2026 Gà Gaming System. All rights reserved.
        </div>
    </div>

    <script>
        const LINK4M_API_TOKEN = "6acf9a55f49ba538753d29e8";

        async function generateKey() {
            const game = document.getElementById('game').value;
            const duration = document.getElementById('duration').value;
            
            const randomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            const generatedKey = `GG-${game.toUpperCase().substring(0,4)}-${randomCode}-${duration}H`;

            const currentUrl = window.location.href.split('?')[0];
            const destinationUrl = currentUrl + "?key=" + encodeURIComponent(generatedKey);

            // Dùng dịch vụ corsproxy để gọi API Link4M trực tiếp từ trang web tĩnh mà không bị chặn
            const targetUrl = `https://link4m.com/api?api=${LINK4M_API_TOKEN}&url=${encodeURIComponent(destinationUrl)}`;
            const proxyUrl = `https://api.allorigins.win/get?url=` + encodeURIComponent(targetUrl);

            alert("Đang tạo link vượt quảng cáo, vui lòng đợi trong giây lát...");

            try {
                let response = await fetch(proxyUrl);
                let data = await response.json();
                let resData = JSON.parse(data.contents);

                if (resData.status === 'success' && resData.shortened_url) {
                    window.location.href = resData.shortened_url;
                } else {
                    alert("Lỗi tạo link từ hệ thống Link4M!");
                }
            } catch (err) {
                // Fallback nếu lỗi mạng: chuyển hướng trực tiếp qua link API
                window.location.href = targetUrl;
            }
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const keyParam = urlParams.get('key');
            if (keyParam) {
                document.getElementById('generator-form').style.display = 'none';
                document.getElementById('result-container').style.display = 'block';
                document.getElementById('final-key').innerText = keyParam;
            }
        }

        function copyKey() {
            const keyText = document.getElementById('final-key').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert("Đã sao chép key thành công: " + keyText);
            });
        }
    </script>
</body>
</html>
