<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gà Gaming Shop - Live Database</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div id="root" class="w-full max-w-md"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18';
        import { createRoot } from 'https://esm.sh/react-dom@18/client';

        // --- CẤU HÌNH KẾT NỐI SUPABASE THẬT CỦA ÔNG ---
        const SUPABASE_URL = 'https://nqozzdvaousgacpjiglw.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_sUYd7prmWNfB2ZUo7gMHEg_BnzBLOAM';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [products, setProducts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => {
                fetchProducts();
            }, []);

            // Lấy danh sách sản phẩm từ bảng 'products' trên Supabase
            async function fetchProducts() {
                setLoading(true);
                setErrorMsg('');
                try {
                    const { data, error } = await supabase.from('products').select('*');
                    if (error) throw error;
                    setProducts(data || []);
                } catch (err) {
                    setErrorMsg('Không thể tải dữ liệu. Hãy kiểm tra lại kết nối bảng products!');
                    console.error('Lỗi:', err.message);
                } finally {
                    setLoading(false);
                }
            }

            return (
                <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl space-y-4">
                    <div className="text-center">
                        <div className="text-3xl">🐔</div>
                        <h1 className="text-xl font-black text-yellow-400">GÀ GAMING SHOP</h1>
                        <p className="text-slate-400 text-xs">Hệ thống Shop Game Tự Động 100%</p>
                    </div>

                    <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                        <div className="flex justify-between items-center">
                            <h2 className="text-sm font-bold text-cyan-400">Kho Tài Khoản (Live DB):</h2>
                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        </div>

                        {loading ? (
                            <p className="text-xs text-slate-500 text-center py-4">Đang đồng bộ dữ liệu với server...</p>
                        ) : errorMsg ? (
                            <p className="text-xs text-red-400 text-center py-2 bg-red-500/10 p-3 rounded-xl border border-red-500/20">{errorMsg}</p>
                        ) : products.length === 0 ? (
                            <p className="text-xs text-slate-500 text-center py-4">Database đang trống (Chưa có sản phẩm nào).</p>
                        ) : (
                            products.map((item, index) => (
                                <div key={index} className="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs">
                                    <div className="space-y-1">
                                        <div className="font-bold text-white">{item.name || item.title || 'Sản phẩm'}</div>
                                        <div className="text-[10px] text-slate-400">Kho: Còn hàng</div>
                                    </div>
                                    <div className="text-right space-y-1">
                                        <div className="text-yellow-400 font-bold">{item.price ? Number(item.price).toLocaleString() + 'đ' : '0đ'}</div>
                                        <button 
                                            onClick={() => alert('Thông tin tài khoản: ' + (item.account_info || 'Chưa cập nhật'))}
                                            className="bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 px-2.5 py-1 rounded-lg text-[10px] font-bold transition">
                                            Mua Ngay
                                        </button>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    <button 
                        onClick={fetchProducts}
                        className="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-yellow-500/20">
                        Làm Mới Dữ Liệu
                    </button>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
