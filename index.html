<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gà Gaming Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl space-y-4" id="app">
        <!-- Header -->
        <div class="text-center flex justify-between items-center border-b border-slate-800 pb-3">
            <div>
                <h1 class="text-lg font-black text-yellow-400">GÀ GAMING SHOP</h1>
                <p class="text-slate-400 text-[10px]">Hệ thống Shop Game Tự Động</p>
            </div>
            <div id="user-box" class="text-right">
                <!-- Hiển thị khi chưa đăng nhập -->
                <button onclick="showAuthModal()" class="bg-yellow-500 text-slate-950 px-3 py-1.5 rounded-xl text-xs font-bold">Đăng Nhập</button>
            </div>
        </div>

        <!-- Nội dung chính: Danh sách sản phẩm -->
        <div class="space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-bold text-cyan-400">Kho Tài Khoản:</h2>
                <button onclick="openDepositModal()" class="text-[10px] bg-green-500/20 text-green-400 px-2 py-1 rounded-lg font-bold border border-green-500/30">Nạp Tiền Thẻ Cào</button>
            </div>
            <div id="product-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <p class="text-xs text-slate-500 text-center py-4">Đang tải sản phẩm...</p>
            </div>
        </div>

        <!-- Nút vào trang Admin -->
        <div class="pt-2 border-t border-slate-800 text-center">
            <button onclick="openAdminLogin()" class="text-[11px] text-slate-400 hover:text-yellow-400 underline">Khu vực quản trị (Admin)</button>
        </div>
    </div>

    <!-- Modal Đăng Nhập / Đăng Ký -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4">
            <h3 id="auth-title" class="text-sm font-bold text-yellow-400 text-center">Đăng Nhập Tài Khoản</h3>
            <input type="text" id="auth-user" placeholder="Tên tài khoản" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-white">
            <input type="password" id="auth-pass" placeholder="Mật khẩu" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-white">
            <div class="flex space-x-2">
                <button onclick="handleAuth()" class="w-full bg-yellow-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs" id="auth-btn">Đăng Nhập</button>
                <button onclick="toggleAuthMode()" class="w-full bg-slate-800 text-slate-300 font-bold py-2.5 rounded-xl text-xs" id="switch-btn">Chuyển Đăng Ký</button>
            </div>
            <button onclick="closeAuthModal()" class="w-full text-slate-500 text-xs text-center pt-2">Đóng</button>
        </div>
    </div>

    <!-- Modal Nạp Thẻ -->
    <div id="deposit-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-3">
            <h3 class="text-sm font-bold text-green-400 text-center">Nạp Tiền Thẻ Cào Chờ Duyệt</h3>
            <select id="card-type" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-white">
                <option value="Viettel">Viettel</option>
                <option value="Vinaphone">Vinaphone</option>
                <option value="Mobifone">Mobifone</option>
            </select>
            <select id="card-amount" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-white">
                <option value="10000">10.000đ</option>
                <option value="20000">20.000đ</option>
                <option value="50000">50.000đ</option>
                <option value="100000">100.000đ</option>
                <option value="200000">200.000đ</option>
                <option value="500000">500.000đ</option>
            </select>
            <input type="text" id="card-serial" placeholder="Nhập số Serial thẻ" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-white">
            <input type="text" id="card-code" placeholder="Nhập mã thẻ cào" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-white">
            <button onclick="submitCard()" class="w-full bg-green-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Gửi Thẻ Nạp</button>
            <button onclick="closeDepositModal()" class="w-full text-slate-500 text-xs text-center pt-1">Đóng</button>
        </div>
    </div>

    <!-- Modal Admin Quản Trị -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-md space-y-4 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-red-400">Trang Quản Trị Admin</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 text-xs">Đóng</button>
            </div>
            <div id="admin-content">
                <!-- Form nhập mật khẩu admin -->
                <div id="admin-login-box" class="space-y-3">
                    <p class="text-xs text-slate-400">Nhập mật khẩu quản trị (Mặc định: 123456):</p>
                    <input type="password" id="admin-pass-input" placeholder="Mật khẩu admin" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-white">
                    <button onclick="checkAdminLogin()" class="w-full bg-red-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Truy Cập</button>
                </div>
                <!-- Bảng duyệt thẻ của admin -->
                <div id="admin-dashboard" class="hidden space-y-3">
                    <h4 class="text-xs font-bold text-yellow-400">Danh Sách Thẻ Chờ Duyệt:</h4>
                    <div id="admin-deposits-list" class="space-y-2">
                        <p class="text-xs text-slate-500 text-center">Chưa có thẻ nào.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nqozzdvaousgacpjiglw.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_sUYd7prmWNfB2ZUo7gMHEg_BnzBLOAM';

        let currentUser = localStorage.getItem('shop_user') ? JSON.parse(localStorage.getItem('shop_user')) : null;

        function updateUI() {
            const userBox = document.getElementById('user-box');
            if (currentUser) {
                userBox.innerHTML = `
                    <div class="text-xs">
                        <span class="text-yellow-400 font-bold">${currentUser.username}</span><br>
                        <span class="text-green-400">Ví: ${Number(currentUser.balance || 0).toLocaleString()}đ</span> | 
                        <button onclick="logout()" class="text-red-400 underline text-[10px]">Thoát</button>
                    </div>
                `;
            } else {
                userBox.innerHTML = `<button onclick="showAuthModal()" class="bg-yellow-500 text-slate-950 px-3 py-1.5 rounded-xl text-xs font-bold">Đăng Nhập</button>`;
            }
        }

        async function loadProducts() {
            const listDiv = document.getElementById('product-list');
            try {
                let res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                let data = await res.json();
                if (!data || data.length === 0) {
                    listDiv.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Chưa có sản phẩm trong kho.</p>';
                    return;
                }
                let html = '';
                data.forEach(item => {
                    html += `
                        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs">
                            <div>
                                <div class="font-bold text-white">${item.name}</div>
                                <div class="text-[10px] text-slate-400">Giá: ${Number(item.price).toLocaleString()}đ</div>
                            </div>
                            <button onclick="buyProduct(${item.id}, '${item.name}', ${item.price}, '${item.account_info}')" class="bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-lg font-bold">Mua</button>
                        </div>
                    `;
                });
                listDiv.innerHTML = html;
            } catch (err) {
                listDiv.innerHTML = '<p class="text-xs text-red-400 text-center">Lỗi tải dữ liệu.</p>';
            }
        }

        // Auth Logic
        let isRegisterMode = false;
        function showAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? "Đăng Ký Tài Khoản" : "Đăng Nhập Tài Khoản";
            document.getElementById('auth-btn').innerText = isRegisterMode ? "Đăng Ký" : "Đăng Nhập";
            document.getElementById('switch-btn').innerText = isRegisterMode ? "Chuyển Đăng Nhập" : "Chuyển Đăng Ký";
        }

        async function handleAuth() {
            let u = document.getElementById('auth-user').value.trim();
            let p = document.getElementById('auth-pass').value.trim();
            if(!u || !p) { alert("Vui lòng điền đủ thông tin!"); return; }

            if(isRegisterMode) {
                let res = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
                    body: JSON.stringify({ username: u, password: p, balance: 0 })
                });
                if(res.ok) { alert("Đăng ký thành công! Hãy đăng nhập."); toggleAuthMode(); }
                else { alert("Tên tài khoản đã tồn tại hoặc lỗi kết nối!"); }
            } else {
                let res = await fetch(`${SUPABASE_URL}/rest/v1/users?username=eq.${u}&password=eq.${p}&select=*`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                let data = await res.json();
                if(data && data.length > 0) {
                    currentUser = data[0];
                    localStorage.setItem('shop_user', JSON.stringify(currentUser));
                    closeAuthModal();
                    updateUI();
                    alert("Đăng nhập thành công!");
                } else {
                    alert("Sai tên tài khoản hoặc mật khẩu!");
                }
            }
        }
        function logout() { currentUser = null; localStorage.removeItem('shop_user'); updateUI(); }

        // Nạp Thẻ
        function openDepositModal() {
            if(!currentUser) { alert("Vui lòng đăng nhập trước khi nạp tiền!"); showAuthModal(); return; }
            document.getElementById('deposit-modal').classList.remove('hidden');
        }
        function closeDepositModal() { document.getElementById('deposit-modal').classList.add('hidden'); }

        async function submitCard() {
            let type = document.getElementById('card-type').value;
            let amount = document.getElementById('card-amount').value;
            let serial = document.getElementById('card-serial').value.trim();
            let code = document.getElementById('card-code').value.trim();

            if(!serial || !code) { alert("Vui lòng nhập đầy đủ serial và mã thẻ!"); return; }

            let res = await fetch(`${SUPABASE_URL}/rest/v1/deposits`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, card_type: type, card_amount: amount, serial: serial, code: code, status: 'pending' })
            });

            if(res.ok) {
                alert("Gửi thẻ thành công! Vui lòng chờ Admin kiểm tra và duyệt tiền.");
                closeDepositModal();
            } else {
                alert("Lỗi gửi thẻ, vui lòng thử lại!");
            }
        }

        // Mua Hàng
        async function buyProduct(id, name, price, info) {
            if(!currentUser) { alert("Vui lòng đăng nhập để mua hàng!"); showAuthModal(); return; }
            if(Number(currentUser.balance) < Number(price)) { alert("Số dư trong ví không đủ! Vui lòng nạp thêm tiền."); return; }

            if(confirm(`Xác nhận mua tài khoản "${name}" với giá ${Number(price).toLocaleString()}đ?`)) {
                let newBalance = Number(currentUser.balance) - Number(price);
                let updateRes = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${currentUser.id}`, {
                    method: 'PATCH',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ balance: newBalance })
                });

                if(updateRes.ok) {
                    currentUser.balance = newBalance;
                    localStorage.setItem('shop_user', JSON.stringify(currentUser));
                    updateUI();
                    alert(`Thanh toán thành công!\n\nThông tin tài khoản của bạn:\n${info}`);
                } else {
                    alert("Lỗi thanh toán!");
                }
            }
        }

        // Admin Quản Trị
        function openAdminLogin() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }

        async function checkAdminLogin() {
            let pass = document.getElementById('admin-pass-input').value;
            if(pass === "123456") {
                document.getElementById('admin-login-box').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadAdminDeposits();
            } else {
                alert("Sai mật khẩu Admin!");
            }
        }

        async function loadAdminDeposits() {
            let listDiv = document.getElementById('admin-deposits-list');
            let res = await fetch(`${SUPABASE_URL}/rest/v1/deposits?status=eq.pending&select=*`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });
            let data = await res.json();
            if(!data || data.length === 0) {
                listDiv.innerHTML = '<p class="text-xs text-slate-500 text-center">Không có thẻ nào đang chờ duyệt.</p>';
                return;
            }
            let html = '';
            data.forEach(item => {
                html += `
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                        <div><b>User:</b> ${item.username} | <b>Loại:</b> ${item.card_type}</div>
                        <div><b>Mệnh giá:</b> ${Number(item.card_amount).toLocaleString()}đ</div>
                        <div><b>Serial:</b> ${item.serial} | <b>Mã:</b> ${item.code}</div>
                        <button onclick="approveCard(${item.id}, '${item.username}', ${item.card_amount})" class="w-full bg-green-500 text-slate-950 font-bold py-1.5 rounded-lg mt-1">Duyệt & Cộng Tiền</button>
                    </div>
                `;
            });
            listDiv.innerHTML = html;
        }

        async function approveCard(depositId, username, amount) {
            // 1. Đổi trạng thái thẻ thành approved
            await fetch(`${SUPABASE_URL}/rest/v1/deposits?id=eq.${depositId}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'approved' })
            });

            // 2. Lấy số dư hiện tại của user đó để cộng thêm tiền
            let userRes = await fetch(`${SUPABASE_URL}/rest/v1/users?username=eq.${username}&select=*`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });
            let userData = await userRes.json();
            if(userData && userData.length > 0) {
                let targetUser = userData[0];
                let updatedBalance = Number(targetUser.balance) + Number(amount);

                await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${targetUser.id}`, {
                    method: 'PATCH',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ balance: updatedBalance })
                });

                alert(`Đã duyệt thành công thẻ cho tài khoản ${username}, cộng thêm ${Number(amount).toLocaleString()}đ vào ví!`);
                loadAdminDeposits();
            }
        }

        updateUI();
        loadProducts();
    </script>
</body>
</html>
