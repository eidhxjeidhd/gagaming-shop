<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gà Gaming - Trang Liên Kết</title>
    <!-- Thư viện FontAwesome để sử dụng icon mạng xã hội -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* Phần thông tin cá nhân / Avatar */
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 5px;
        }

        .profile-bio {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 25px;
        }

        /* Tiêu đề nhóm */
        .section-title {
            font-size: 1rem;
            color: #4a5568;
            margin: 20px 0 10px 0;
            text-align: left;
            font-weight: 600;
            border-left: 4px solid #667eea;
            padding-left: 8px;
        }

        /* Các nút liên kết chung */
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            text-decoration: none;
            color: #2d3748;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
            color: #667eea;
        }

        .link-card i.left-icon {
            font-size: 1.2rem;
            width: 25px;
            text-align: center;
        }

        .link-card span {
            flex-grow: 1;
            text-align: left;
            margin-left: 10px;
        }

        /* Màu riêng khi rê chuột hoặc chạm vào mạng xã hội */
        .link-card.facebook:hover { background: #1877f2; color: white; border-color: #1877f2; }
        .link-card.instagram:hover { background: #e4405f; color: white; border-color: #e4405f; }
        .link-card.tiktok:hover { background: #000000; color: white; border-color: #000000; }
        .link-card.youtube:hover { background: #ff0000; color: white; border-color: #ff0000; }
        .link-card.file:hover { background: #2b6cb0; color: white; border-color: #2b6cb0; }

        /* Footer */
        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ảnh đại diện -->
        <img src="https://via.placeholder.com/150" alt="Avatar" class="profile-img">
        <h1 class="profile-name">Gà Gaming</h1>
        <p class="profile-bio">Chào mừng bạn đến với trang liên kết chính thức của tôi!</p>

        <!-- Nhóm Mạng Xã Hội -->
        <div class="section-title">Mạng xã hội</div>
        
        <a href="https://www.tiktok.com/@idollatao" class="link-card tiktok" target="_blank">
            <i class="fab fa-tiktok left-icon"></i>
            <span>TikTok: @idollatao</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>

        <a href="https://www.youtube.com/@gagaming-u2x" class="link-card youtube" target="_blank">
            <i class="fab fa-youtube left-icon"></i>
            <span>YouTube: Gà Gaming</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>

        <a href="https://www.facebook.com/nguyenvantien183273" class="link-card facebook" target="_blank">
            <i class="fab fa-facebook-f left-icon"></i>
            <span>Facebook cá nhân</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>

        <a href="https://instagram.com" class="link-card instagram" target="_blank">
            <i class="fab fa-instagram left-icon"></i>
            <span>Instagram</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>

        <!-- Nhóm Liên Kết File & Tài Liệu -->
        <div class="section-title">Tài liệu & File tải xuống</div>

        <a href="files/tai-lieu.docx" class="link-card file" download>
            <i class="fa-solid fa-file-word left-icon" style="color: #3182ce;"></i>
            <span>Tài liệu / Script của tôi</span>
            <i class="fa-solid fa-download"></i>
        </a>

        <a href="https://drive.google.com" class="link-card file" target="_blank">
            <i class="fa-solid fa-folder-open left-icon" style="color: #d69e2e;"></i>
            <span>Kho lưu trữ Google Drive</span>
            <i class="fa-solid fa-external-link"></i>
        </a>

        <!-- Bản quyền -->
        <div class="footer">
            &copy; 2026 Gà Gaming
        </div>
    </div>

</body>
</html>
