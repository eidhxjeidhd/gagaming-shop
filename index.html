<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Link 4M - Siêu Tốc 24/7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 py-4">
        <div class="max-w-xl mx-auto px-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-bolt text-yellow-400 text-2xl"></i>
                <span class="font-bold text-lg tracking-wider text-yellow-400">BYPASS LINK 4M</span>
            </div>
            <span class="text-xs bg-yellow-500/20 text-yellow-400 px-2.5 py-1 rounded-full font-semibold">Fast & Free</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-xl mx-auto px-4 w-full my-auto py-8">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5">
            <div class="text-center space-y-1">
                <h1 class="text-2xl font-extrabold text-white">Vượt Link Rút Gọn Tự Động</h1>
                <p class="text-slate-400 text-sm">Dán link 4m vào đây, hệ thống sẽ xử lý trong 3 giây!</p>
            </div>

            <!-- Form Input -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1.5 font-medium">Nhập Link Cần Bypass</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-link"></i>
                        </span>
                        <input type="text" id="target-link" placeholder="https://link4m.com/..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm text-white focus:outline-none focus:border-yellow-500 transition">
                    </div>
                </div>

                <button onclick="handleBypass()" id="btn-bypass" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Bypass Ngay Lập Tức</span>
                </button>
            </div>

            <!-- Result Box -->
            <div id="result-box" class="hidden space-y-3 pt-4 border-t border-slate-800">
                <label class="block text-sm text-emerald-400 font-semibold"><i class="fa-solid fa-circle-check mr-1"></i> Link Gốc Đã Vượt Thành Công:</label>
                <div class="flex items-center space-x-2">
                    <input type="text" id="result-url" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-yellow-400 select-all focus:outline-none">
                    <button onclick="copyResult()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl text-sm transition font-medium whitespace-nowrap">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-900">
        Phát triển bởi Gà Gaming &bull; Hoạt động ổn định 24/7
    </footer>

    <!-- Script Xử Lý -->
    <script>
        function handleBypass() {
            const inputLink = document.getElementById('target-link').value.trim();
            const btn = document.getElementById('btn-bypass');
            const resultBox = document.getElementById('result-box');
            const resultUrl = document.getElementById('result-url');

            if (!inputLink) {
                alert('Vui lòng nhập link cần bypass trước nhé!');
                return;
            }

            if (!inputLink.includes('link4m')) {
                alert('Đường dẫn có vẻ không phải link 4m, hãy kiểm tra lại!');
                return;
            }

            // Hiệu ứng đang xử lý
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...`;

            setTimeout(() => {
                // Đoạn này Hoàng có thể thay thế bằng logic API kết nối hoặc script thuật toán bypass của Hoàng
                // Tạm thời giả lập kết quả trả về link gốc sạch sẽ cho khách
                let cleanedLink = inputLink.replace('link4m.com', 'destination-link.net/success'); 
                
                resultUrl.value = cleanedLink;
                resultBox.classList.remove('hidden');

                // Trả lại trạng thái nút bấm
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Bypass Ngay Lập Tức`;
            }, 1500);
        }

        function copyResult() {
            const copyText = document.getElementById('result-url');
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert('Đã sao chép link gốc thành công!');
        }
    </script>
</body>
</html>
